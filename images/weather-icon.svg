<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD75A"/>
      <stop offset="100%" stop-color="#F2B93B"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EDF3"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Sun -->
  <circle cx="132" cy="70" r="36"
          fill="url(#sunGrad)"
          filter="url(#softShadow)"/>

  <!-- Cloud -->
  <g fill="url(#cloudGrad)" filter="url(#softShadow)">
    <circle cx="78" cy="106" r="42"/>
    <circle cx="118" cy="116" r="34"/>
    <circle cx="52" cy="128" r="27"/>
    <circle cx="148" cy="131" r="24"/>
    <rect x="45" y="105" width="126" height="50" rx="25"/>
  </g>
</svg>
