<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jean Marco Carnevali | WDD 131 Dynamic Web Fundamentals | Colombia">
    <meta name="author" content="Jean Marco Carnevali">
    <title>WDD 131 - Colombia - Jean Marco Carnevali</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Colombia</h1>
    </header>
    <main>
        <picture class="hero">
            <source srcset="images/colombia-large.webp" media="(min-width: 850px)">
            <img src="images/colombia-small.webp" alt="A parrot in Colombia" fetchpriority=high>
        </picture>
        <section class="data">
            <h2>Data</h2>

            <div class="info">

                <span class="label">Area:</span>
                <span class="label-info">1,141,748 sq km</span>

                <span class="label">Population</span>
                <span class="label-info">53,426,000</span>

                <span class="label">Capital:</span>
                <span class="label-info">Bogotá</span>

                <span class="label">Languages:</span>
                <span class="label-info">Spanish</span>

                <span class="label">Currency:</span>
                <span class="label-info">Colombian Peso</span>

                <span class="label">Time Zone:</span>
                <span class="label-info">UTC-5</span>

                <span class="label">Calling Code:</span>
                <span class="label-info">+57</span>

                <span class="label">Internet TLD:</span>
                <span class="label-info">.co</span>

            </div>
        </section>

        <section class="weather">
            <h2>Weather</h2>
           <img class="weather-icon" src="images/weather-icon.svg" alt="Weather icon"> 

           <div class="info">
                <span class="label">Temperature:</span>
                <span class="label-info">18°C</span>

                <span class="label">Conditions:</span>
                <span class="label-info">Partly Cloudy</span>

                <span class="label">Wind:</span>
                <span class="label-info">5 km/h</span>

                <span class="label">Wind Chill:</span>
                <span class="label-info" id="windchill"></span>
           </div>

        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> | Jean Marco Carnevali | Bogotá, Colombia</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
