<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jean Marco Carnevali | WDD 131 Dynamic Web Fundamentals | Product Review">
    <meta name="author" content="Jean Marco Carnevali">
    <title>Product Review - Jean Marco Carnevali</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main> 
        <form method="get" action="review.html">
            <label for="product">Product Name*</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <p>Overall Rating*</p>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>

            <label for="installation">Date of Installation*</label>
            <input type="date" id="installation" name="installation" required>

            <p>Which features did you find useful in the product? (Check all that apply)</p>
            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="durability">Durability
            </label>
            <label for="easeOfUse">
                <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">Ease of Use
            </label>
            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="performance">Performance
            </label>
            <label for="design">
                <input type="checkbox" id="design" name="features" value="design">Design
            </label>

            <label for="review">Written Review
                <span class="optional">(Optional)</span>
            </label>

            <textarea name="review" id="review" rows="6"></textarea>

            <label for="username">Your Name
                <span class="optional">(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">

        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> | Jean Marco Carnevali | Bogotá, Colombia</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
